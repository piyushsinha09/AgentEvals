name: agent-eval

on:
  pull_request:
    paths: ["agent/**", "evals/**", "scripts/**", "config.py", "pyproject.toml", "uv.lock"]
  schedule:
    - cron: "30 20 * * *"   # nightly full run (02:00 IST)
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Offline unit tests (free)
        run: uv run pytest

      # Pull requests: cheap smoke subset. Nightly / manual: full dataset.
      - name: Run evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run python -m scripts.run_eval --smoke
          else
            uv run python -m scripts.run_eval
          fi

      - name: Post score table on the PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: reports/latest.md

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/
